<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1, initial-scale=1.0">
    <title>comments</title>
</head>

<body>
    <!-- this is a comment     -->
    <p>this is visible content</p>
    <!-- <p>this line will not show on the webpage. </p> -->

    <p>this     is    spaced.</p>
    <!-- output=this is spaced -->

    <pre>this   is   preformatted
        tag.
    </pre>
    <!-- now this will preserve the whitespaces and comments -->
</body>

</html>
