<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>

<body>
    <!--head section-->
    <header>
        <h1>These are the examples of iframe</h1>
    </header>
    <!--main section-->
    <main>
        <!--section = where all your iframes will be-->
        <section>
            <!--iframe for wikipedia-->
            <h2>iframe = wikipedia.org</h2>
            <iframe src="https://www.wikipedia.org" width="500" height="300" frameborder="0"></iframe>
            <!--iframe for a youtube video-->
            <h2>iframe = youtube video</h2>
            <iframe width="500" height="300" src="https://www.youtube.com/embed/kffacxfA7G4?si=XM05dyyaBGvBw1rI"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <!--iframe for claude-->
            <h2>iframe = claude.ai</h2>
            <iframe src="https://claude.ai" width="500" height="300" frameborder="0"></iframe>
        </section>
    </main>

</body>

</html>
