    <!--header-->
    <header>
        <h1>My Website</h1>
    </header>

    <!--navigation bar-->
    <nav>
        <ul>
            <li><a href="https://www.google.com">this is a link to google.</a></li>
            <li><a href="https://www.facebook.com">this is a link to facebook.</a></li>
        </ul>
    </nav>

    <!--main section-->
    <main>
        <section>
            <h2>Welcome</h2>
            <p>This is my welcome section.</p>
        </section>

        <!--article-->
        <article>
            <h2>Blog post</h2>
            <p>this is a blog post inside an article tag.</p>
        </article>

        <!--aside-->
        <aside>
            <p>this is a sidebar with related links.</p>
        </aside>
    </main>

    <!--footer-->
    <footer>
        <p>&copy; 2025</p>
    </footer>
